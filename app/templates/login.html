<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — TriBoost</title>
<style>
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --gold: #fbc02d;
    --text-dark: #212121;
    --text-muted: #757575;
    --border: #eeeeee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: #fcfcfc;
    color: var(--text-dark);
    display: flex; justify-content: center;
    min-height: 100vh;
  }
  .wrap {
    width: 100%; max-width: 420px;
    padding: 40px 24px;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 100vh;
  }
  .logo {
    text-align: center; font-size: 32px;
    font-weight: 800; color: var(--green);
    margin-bottom: 8px;
  }
  .logo span { color: var(--gold); }
  .subtitle {
    text-align: center; color: var(--text-muted);
    font-size: 14px; margin-bottom: 32px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 14px;
    border: 1px solid var(--border); border-radius: 12px;
    font-size: 14px; outline: none; transition: 0.2s;
  }
  .form-group input:focus { border-color: var(--green); }
  .btn-primary {
    width: 100%; padding: 14px; background: var(--green);
    color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 15px;
    cursor: pointer; margin-top: 8px;
    transition: 0.2s;
  }
  .btn-primary:hover { background: var(--green-dark); }
  .footer {
    text-align: center; margin-top: 24px;
    font-size: 14px; color: var(--text-muted);
  }
  .footer a {
    color: var(--green); font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Tri<span>Boost</span></div>
  <div class="subtitle">Connectez-vous à votre compte</div>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="vous@exemple.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-primary">Se connecter</button>
  </form>

  <div class="footer">
    Pas de compte ? <a href="/register">Inscrivez-vous</a>
  </div>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    // Étape 1 : on redirige simplement vers le dashboard
    // L'API de login viendra à l'étape 3
    window.location.href = '/dashboard';
  }
</script>
</body>
</html>
