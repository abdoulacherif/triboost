<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — TriBoost</title>
<style>
  :root {
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --gold: #fbc02d;
    --text-dark: #212121;
    --text-muted: #757575;
    --border: #eeeeee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: #fcfcfc; color: var(--text-dark);
    display: flex; justify-content: center; min-height: 100vh;
  }
  .wrap {
    width: 100%; max-width: 420px; padding: 40px 24px;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 100vh;
  }
  .logo {
    text-align: center; font-size: 32px; font-weight: 800;
    color: var(--green); margin-bottom: 8px;
  }
  .logo span { color: var(--gold); }
  .subtitle {
    text-align: center; color: var(--text-muted);
    font-size: 14px; margin-bottom: 24px;
  }
  .referral-info {
    background: var(--green-light); color: var(--green);
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; margin-bottom: 16px;
    text-align: center;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 14px; border: 1px solid var(--border);
    border-radius: 12px; font-size: 14px; outline: none;
  }
  .form-group input:focus { border-color: var(--green); }
  .btn-primary {
    width: 100%; padding: 14px; background: var(--green);
    color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px;
  }
  .footer {
    text-align: center; margin-top: 24px;
    font-size: 14px; color: var(--text-muted);
  }
  .footer a { color: var(--green); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Tri<span>Boost</span></div>
  <div class="subtitle">Créez votre compte gratuit</div>

  <div class="referral-info">🎁 Inscription via un lien de parrainage</div>

  <form onsubmit="handleRegister(event)">
    <div class="form-group">
      <label>Nom complet</label>
      <input type="text" required placeholder="Ex : Abdoula Diallo">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" required placeholder="vous@exemple.com">
    </div>
    <div class="form-group">
      <label>Numéro Mobile Money</label>
      <input type="tel" required placeholder="+237 6XX XXX XXX">
    </div>
    <div class="form-group">
      <label>Mot de passe (min. 10 caractères)</label>
      <input type="password" minlength="10" required>
    </div>
    <button type="submit" class="btn-primary">Créer mon compte</button>
  </form>

  <div class="footer">
    Déjà inscrit ? <a href="/login">Se connecter</a>
  </div>
</div>

<script>
  function handleRegister(e) {
    e.preventDefault();
    // Étape 1 : redirection simple
    // L'API d'inscription viendra à l'étape 3
    alert('Compte créé (démo) !');
    window.location.href = '/login';
  }
</script>
</body>
</html>
